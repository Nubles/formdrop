<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FormDrop</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --bg-drag: #efebe3;
      --ink: #141414;
      --muted: #5c5c5c;
      --err: #b42318;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100%;
      cursor: pointer;
      -webkit-font-smoothing: antialiased;
    }
    body.drag { background: var(--bg-drag); }
    main {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 3rem 1.5rem 4rem;
      pointer-events: none;
      gap: 0.85rem;
    }
    h1 {
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      font-weight: 560;
      letter-spacing: -0.035em;
      line-height: 1.15;
      margin: 0;
    }
    .lede {
      margin: 0;
      max-width: 28rem;
      font-size: 1.05rem;
      line-height: 1.5;
      color: var(--muted);
      font-weight: 400;
    }
    #msg {
      margin: 1.1rem 0 0;
      max-width: 32rem;
      font-size: 1.05rem;
      line-height: 1.45;
      min-height: 1.5em;
    }
    #msg.ok { color: var(--ink); }
    #msg.err { color: var(--err); }
    #msg:empty { display: none; }
    input { position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <main>
    <h1>Drop filled PDFs</h1>
    <p class="lede">Same form, many copies. Empty fields stay empty. Files never leave this page.</p>
    <p id="msg"></p>
  </main>
  <input id="pick" type="file" accept="application/pdf,.pdf" multiple>
  <script type="module">
    import {
      PDFDocument,
      PDFDict,
      PDFArray,
      PDFName,
      PDFString,
      PDFHexString,
      PDFRef,
    } from "https://cdn.jsdelivr.net/npm/@cantoo/pdf-lib@2.9.1/dist/pdf-lib.esm.min.js";

    const pick = document.getElementById("pick");
    const msg = document.getElementById("msg");

    function setMsg(text, kind) {
      msg.textContent = text || "";
      msg.className = kind || "";
    }

    function isPdf(file) {
      const name = (file.name || "").toLowerCase();
      return file.type === "application/pdf" || name.endsWith(".pdf");
    }

    function csvCell(value) {
      const s = value == null ? "" : String(value);
      if (/[",\n\r]/.test(s)) return `"${s.replace(/"/g, "\"\"")}"`;
      return s;
    }

    function downloadCsv(text) {
      const blob = new Blob([text], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "responses.csv";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function isPasswordError(err) {
      if (!err) return false;
      const name = err.name || "";
      const text = String(err.message || err);
      return (
        name === "EncryptedPDFError" ||
        name === "PasswordException" ||
        /password/i.test(text) ||
        /encrypted/i.test(text)
      );
    }

    function deref(obj, context) {
      if (obj instanceof PDFRef) {
        try { return context.lookup(obj); } catch (_) { return undefined; }
      }
      return obj;
    }

    function asDict(obj, context) {
      const value = deref(obj, context);
      return value instanceof PDFDict ? value : null;
    }

    function cleanText(value) {
      return String(value || "").replace(/\r\n|\r|\n/g, " ").trim();
    }

    function decodePDFObject(obj, context) {
      if (obj == null) return "";
      obj = deref(obj, context);
      if (obj == null) return "";
      if (obj instanceof PDFString || obj instanceof PDFHexString) {
        try { return obj.decodeText(); } catch (_) {}
        try { return obj.asString(); } catch (_) {}
        return "";
      }
      if (obj instanceof PDFName) {
        try {
          if (typeof obj.decodeText === "function") return obj.decodeText();
        } catch (_) {}
        const s = obj.asString();
        return s.charAt(0) === "/" ? s.slice(1) : s;
      }
      if (obj instanceof PDFArray) {
        const parts = [];
        for (let i = 0; i < obj.size(); i++) {
          const piece = decodePDFObject(obj.lookup(i), context);
          if (piece) parts.push(piece);
        }
        return parts.join(", ");
      }
      if (typeof obj.asBoolean === "function") {
        try { return obj.asBoolean() ? "true" : "false"; } catch (_) {}
      }
      if (typeof obj.asNumber === "function") {
        try { return String(obj.asNumber()); } catch (_) {}
      }
      return "";
    }

    function fieldValue(dict, context) {
      if (!dict.has(PDFName.of("V"))) return "";
      const raw = cleanText(decodePDFObject(dict.lookup(PDFName.of("V")), context));
      if (!raw || raw === "Off" || raw === "/Off") return "";
      return raw;
    }

    function collectFields(pdfDoc) {
      const context = pdfDoc.context;
      const acroForm = pdfDoc.catalog.lookupMaybe(PDFName.of("AcroForm"), PDFDict);
      if (!acroForm) return [];
      const fieldsArr = acroForm.lookupMaybe(PDFName.of("Fields"), PDFArray);
      if (!fieldsArr) return [];
      const out = [];
      const seen = new Set();
      function walk(node) {
        const dict = asDict(node, context);
        if (!dict || seen.has(dict)) return;
        seen.add(dict);
        const name = cleanText(decodePDFObject(dict.lookup(PDFName.of("T")), context));
        if (name) {
          const tu = dict.lookup(PDFName.of("TU"));
          const label = tu ? (cleanText(decodePDFObject(tu, context)) || name) : name;
          out.push({ name, label, value: fieldValue(dict, context) });
        }
        const kids = dict.lookupMaybe(PDFName.of("Kids"), PDFArray);
        if (kids) {
          for (let i = 0; i < kids.size(); i++) walk(kids.get(i));
        }
      }
      for (let i = 0; i < fieldsArr.size(); i++) walk(fieldsArr.get(i));
      return out;
    }

    function uniqueHeaders(fields) {
      const counts = new Map();
      for (const f of fields) counts.set(f.label, (counts.get(f.label) || 0) + 1);
      return fields.map((f) => (counts.get(f.label) > 1 ? `${f.label} ${f.name}` : f.label));
    }

    async function readFields(file) {
      const bytes = new Uint8Array(await file.arrayBuffer());
      const pdfDoc = await PDFDocument.load(bytes, { ignoreEncryption: true, password: "" });
      const fields = collectFields(pdfDoc);
      if (!fields.length) return null;
      const names = fields.map((f) => f.name);
      const headers = uniqueHeaders(fields);
      const values = {};
      for (let i = 0; i < fields.length; i++) values[names[i]] = fields[i].value;
      return { names, headers, values };
    }

    function namesKey(names) {
      return [...names].sort().join("\u0001");
    }

    async function handleFiles(fileList) {
      const files = [...fileList];
      if (!files.length) return;

      if (files.some((f) => !isPdf(f))) {
        setMsg("Only PDFs.", "err");
        return;
      }

      const rows = [];
      let schema = null;
      let headers = null;
      const errors = [];

      for (const file of files) {
        let extracted;
        try {
          extracted = await readFields(file);
        } catch (err) {
          if (isPasswordError(err)) {
            errors.push(`${file.name} is locked.`);
          } else {
            errors.push(`Couldn't read ${file.name}.`);
          }
          continue;
        }

        if (!extracted || !extracted.names.length) {
          errors.push(`${file.name} has no fillable fields.`);
          continue;
        }

        const names = extracted.names;
        if (!schema) {
          schema = names;
          headers = extracted.headers;
        } else if (namesKey(names) !== namesKey(schema)) {
          errors.push("These aren't the same form. Use copies of one PDF.");
          continue;
        }

        const row = { file: file.name };
        for (let i = 0; i < schema.length; i++) {
          const name = schema[i];
          const header = headers[i];
          row[header] = Object.prototype.hasOwnProperty.call(extracted.values, name)
            ? extracted.values[name]
            : "";
        }
        rows.push(row);
      }

      if (errors.length) {
        const unique = [...new Set(errors)];
        setMsg(unique.join(" "), "err");
        return;
      }

      const csvHeaders = ["file", ...headers];
      const lines = [csvHeaders.map(csvCell).join(",")];
      for (const row of rows) {
        lines.push(csvHeaders.map((h) => csvCell(row[h] ?? "")).join(","));
      }
      downloadCsv(lines.join("\r\n"));
      setMsg(`Downloaded responses.csv (${rows.length} rows). Drop more anytime.`, "ok");
    }

    document.body.addEventListener("click", () => pick.click());
    pick.addEventListener("click", (e) => e.stopPropagation());
    pick.addEventListener("change", () => {
      handleFiles(pick.files).catch(() => setMsg("Couldn't read the files.", "err"));
      pick.value = "";
    });

    ["dragenter", "dragover"].forEach((type) => {
      document.addEventListener(type, (e) => {
        e.preventDefault();
        document.body.classList.add("drag");
      });
    });
    ["dragleave", "drop"].forEach((type) => {
      document.addEventListener(type, (e) => {
        e.preventDefault();
        if (type === "dragleave" && e.target !== document.body) return;
        document.body.classList.remove("drag");
      });
    });
    document.addEventListener("drop", (e) => {
      e.preventDefault();
      document.body.classList.remove("drag");
      handleFiles(e.dataTransfer.files).catch(() => setMsg("Couldn't read the files.", "err"));
    });
  </script>
</body>
</html>
